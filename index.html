<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtual School Demo</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 40px; }
    main { max-width: 780px; margin: auto; }
  </style>
</head>
<body>
  <main>
    <h1>Virtual School Demo</h1>
    <p>Test the EduSmartBot on this page.</p>
  </main>

  <!-- 1) Chatbase widget (load first) -->
  <script>
    /* ⚠️ Ensure this is the EXACT bot ID from Deploy → Web for the bot
       that contains the 'pre_enrolment_form' client-side action */
    window.chatbaseConfig = { chatbotId: "PqCH9sQBjkLjI_rQCRRwY" };
  </script>
  <script src="https://www.chatbase.co/embed.min.js" defer></script>

  <!-- 2) Register the client-side form schema (must match Action name exactly) -->
  <script>
    (function () {
      var registered = false;

      function registerForm() {
        if (registered) return;
        if (window.chatbase && typeof window.chatbase.registerFormSchema === 'function') {
          window.chatbase.registerFormSchema({
            "pre_enrolment_form": async (args, user) => {
              return {
                fields: [
                  {
                    type: "text",
                    name: "full_name",
                    label: "Full name",
                    placeholder: "Enter your full name",
                    validation: { required: { value: true, message: "Name is required" } }
                  },
                  {
                    type: "text",
                    name: "email",
                    label: "Email",
                    placeholder: "name@example.com",
                    validation: { required: { value: true, message: "Email is required" } }
                  },
                  {
                    type: "text",
                    name: "phone",
                    label: "WhatsApp phone (+CC…)",
                    placeholder: "e.g., +971501234567",
                    validation: { required: { value: true, message: "Phone is required" } }
                  },
                  {
                    type: "text",
                    name: "program_interest",
                    label: "Program of interest",
                    placeholder: "e.g., Web Dev",
                    validation: { required: { value: true, message: "Program is required" } }
                  },
                  {
                    type: "text",
                    name: "intake_month",
                    label: "Desired intake (e.g., Sep 2025)",
                    placeholder: "e.g., Sep 2025",
                    validation: { required: { value: true, message: "Intake month is required" } }
                  },
                  {
                    type: "checkbox",
                    name: "consent",
                    label: "I agree to be contacted",
                    validation: { required: { value: true, message: "Consent is required" } }
                  }
                ],
                submitButtonText: "Submit",
                successMessage: "Thanks! We’ll contact you shortly.",
                errorMessage: "Something went wrong. Please try again."
              };
            }
          });
          registered = true;
          console.log('[chatbase] schema registered for pre_enrolment_form');
        } else {
          setTimeout(registerForm, 150);
        }
      }

      // Start polling after the embed script is parsed
      registerForm();
    })();
  </script>
</body>
</html>
