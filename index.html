<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-Enrolment Form Integration</title>

  <!-- Chatbase Embed Script (MUST load first) -->
  <script>
    (function(){
      if(!window.chatbase||window.chatbase("getState")!=="initialized"){
        window.chatbase=(...arguments)=>(window.chatbase.q=window.chatbase.q||[]).push(arguments)
      }
      window.chatbase("init",{
        chatbotId: "PqCH9sQBjkLjI_rQCRRwY",
        domain: "www.chatbase.co"
      })
    })();
  </script>
  <script src="https://www.chatbase.co/embed.min.js" defer></script>
</head>
<body>

  <h1>Welcome — Pre-Enrolment</h1>
  <p>Chat with our assistant to begin your enrolment process.</p>

  <!-- Form Schema Registration (after embed script) -->
  <script>
  (function() {
    'use strict';

    const FORM_KEY = 'pre_enrolment_form'; // MUST match Chatbase Action name exactly
    let registered = false;

    /**
     * Poller: waits for window.chatbase.registerFormSchema to exist
     * Avoids shadowing the global object [[4]]
     */
    function waitForChatbase(callback, maxAttempts = 50, interval = 100) {
      let attempts = 0;
      const poll = setInterval(() => {
        attempts++;
        console.log(`[chatbase-poller] Attempt ${attempts}: checking for registerFormSchema...`);

        if (
          typeof window.chatbase === 'function' &&
          typeof window.chatbase.registerFormSchema === 'function'
        ) {
          clearInterval(poll);
          console.log('[chatbase-poller] ✅ registerFormSchema is available');
          callback();
        } else if (attempts >= maxAttempts) {
          clearInterval(poll);
          console.error('[chatbase-poller] ❌ Timed out waiting for registerFormSchema');
        }
      }, interval);
    }

    /**
     * The form schema function
     * Signature: async (args, user) => FormSchema
     */
    async function preEnrolmentSchema(args, user) {
      console.log('[chatbase] preEnrolmentSchema invoked with:', { args, user });

      return {
        fields: [
          {
            name: 'full_name',
            type: 'text',
            label: 'Full Name',
            placeholder: 'Enter your full name',
            validation: {
              required: {
                value: true,
                message: 'Full name is required'
              }
            }
          },
          {
            name: 'email',
            type: 'text', // text for maximum compatibility
            label: 'Email Address',
            placeholder: 'you@example.com',
            validation: {
              required: {
                value: true,
                message: 'Email is required'
              }
            }
          },
          {
            name: 'phone',
            type: 'text', // text to preserve E.164 format (+1234567890)
            label: 'Phone Number',
            placeholder: '+1 555 123 4567',
            validation: {
              required: {
                value: true,
                message: 'Phone number is required'
              }
            }
          },
          {
            name: 'program_interest',
            type: 'select',
            label: 'Program of Interest',
            placeholder: 'Select a program',
            options: [
              { label: 'Certificate Program', value: 'certificate' },
              { label: 'Diploma Program', value: 'diploma' },
              { label: 'Degree Program', value: 'degree' }
            ],
            validation: {
              required: {
                value: true,
                message: 'Please select a program'
              }
            }
          }
        ],
        submitButtonText: 'Submit Pre-Enrolment',
        successMessage: 'Thank you! Your pre-enrolment has been received.',
        errorMessage: 'Something went wrong. Please try again or contact support.'
      };
    }

    /**
     * Register the schema once
     */
    function registerSchema() {
      if (registered) {
        console.warn('[chatbase] Schema already registered, skipping');
        return;
      }

      try {
        window.chatbase.registerFormSchema(FORM_KEY, preEnrolmentSchema);
        registered = true;
        console.log(`[chatbase] ✅ Schema registered for "${FORM_KEY}"`);

        // DEBUG: Confirm registration payload
        console.log('[chatbase] Registered function reference:', preEnrolmentSchema);
      } catch (err) {
        console.error('[chatbase] ❌ Registration failed:', err);
      }
    }

    // Initialize
    if (document.readyState === 'complete') {
      waitForChatbase(registerSchema);
    } else {
      window.addEventListener('load', () => waitForChatbase(registerSchema));
    }

  })();
  </script>

</body>
</html>
