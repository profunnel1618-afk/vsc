<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtual School Demo</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 40px; }
    main { max-width: 780px; margin: auto; }
  </style>
</head>
<body>
  <main>
    <h1>Virtual School Demo</h1>
    <p>Test the EduSmartBot on this page.</p>
  </main>

  <!-- Chatbase widget -->
  <script>
    window.chatbaseConfig = { chatbotId: "PqCH9sQBjkLjI_rQCRRwY" };
  </script>
  <script src="https://www.chatbase.co/embed.min.js" defer></script>

  <!-- Client-side Custom Form schema: MUST match the Chatbase Action name and input names -->
<script>
  window.chatbase = window.chatbase || {};
  (function registerWhenReady(actionName, schemaFactory) {
    function tryRegister() {
      if (window.chatbase && typeof window.chatbase.registerFormSchema === 'function') {
        window.chatbase.registerFormSchema({ [actionName]: schemaFactory });
      } else { setTimeout(tryRegister, 100); }
    }
    tryRegister();
  })('pre_enrolment_form', async (args, user) => {
    return {
      fields: [
        { type: "text",    name: "first_name",        label: "First name", required: true },
        { type: "text",    name: "last_name",         label: "Last name",  required: true },
        { type: "email",   name: "email",             label: "Email",      required: true },
        { type: "text",    name: "phone",             label: "Phone (+CC…)", required: true,
          placeholder: "e.g., +971501234567" },
        { type: "text",    name: "target_program",    label: "Target program", required: true },
        { type: "text",    name: "desired_intake",    label: "Desired intake (e.g., Sep 2025)", required: true },
        { type: "checkbox",name: "consent",           label: "I agree to be contacted", required: true }
      ],
      submitButtonText: "Submit pre-enrolment",
      successMessage: "Thanks! We’ll contact you shortly.",
      errorMessage: "Something went wrong. Please try again."
    };
  });
</script>

</body>
</html>
